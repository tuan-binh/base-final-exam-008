spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: doctor-service
              uri: lb://doctor-service
              predicates:
                - Path=/api/v1/doctors/**
            - id: appointment-service
              uri: lb://appointment-service
              predicates:
                - Path=/api/v1/appointments/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/